services:
  mongo:
    image: mongo:7
    container_name: turnhub-mongo
    # Replica set de un solo nodo: necesario para las transacciones de "llamar al siguiente turno".
    command: ["--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "27017:27017"
    volumes:
      - turnhub-mongo-data:/data/db
    healthcheck:
      # Inicializa el replica set la primera vez y luego solo verifica que esté arriba.
      test: >
        mongosh --quiet --eval "try { rs.status().ok } catch (e) { rs.initiate({ _id: 'rs0', members: [{ _id: 0, host: 'localhost:27017' }] }).ok }"
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 5s

volumes:
  turnhub-mongo-data:
