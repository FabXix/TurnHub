<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TurnHub</title>
<style>
  :root {
    --bg: #f4f6fb; --card: #fff; --ink: #1c2333; --muted: #6b7489;
    --brand: #4f46e5; --brand-ink: #fff; --line: #e3e7f0;
    --ok: #16a34a; --err: #dc2626;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: system-ui, -apple-system, Segoe UI, sans-serif; background: var(--bg); color: var(--ink); }
  header { background: var(--brand); color: var(--brand-ink); padding: 16px 24px; display: flex; align-items: center; gap: 12px; }
  header h1 { margin: 0; font-size: 20px; }
  header .dot { width: 10px; height: 10px; border-radius: 50%; background: #9ca3af; margin-left: auto; }
  header .dot.on { background: #4ade80; }
  header small { opacity: .85; }
  main { display: grid; grid-template-columns: 340px 1fr; gap: 20px; padding: 20px; max-width: 1100px; margin: 0 auto; }
  @media (max-width: 760px) { main { grid-template-columns: 1fr; } }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 16px; }
  .card h2 { margin: 0 0 12px; font-size: 15px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); }
  .store { display: block; width: 100%; text-align: left; background: none; border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; margin-bottom: 8px; cursor: pointer; font: inherit; color: inherit; }
  .store:hover { border-color: var(--brand); }
  .store.active { border-color: var(--brand); background: #eef2ff; }
  .store b { display: block; }
  .store span { font-size: 13px; color: var(--muted); }
  details { margin-top: 12px; }
  summary { cursor: pointer; font-weight: 600; color: var(--brand); }
  label { display: block; font-size: 13px; color: var(--muted); margin-top: 8px; }
  input { width: 100%; padding: 8px; border: 1px solid var(--line); border-radius: 8px; font: inherit; margin-top: 3px; }
  button.primary { background: var(--brand); color: var(--brand-ink); border: 0; border-radius: 10px; padding: 10px 16px; font: inherit; font-weight: 600; cursor: pointer; margin-top: 12px; }
  button.primary:hover { filter: brightness(1.1); }
  button.primary:disabled { opacity: .5; cursor: default; }
  .empty { color: var(--muted); text-align: center; padding: 40px 10px; }
  .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin: 8px 0 16px; }
  .stat { background: var(--bg); border-radius: 12px; padding: 16px; text-align: center; }
  .stat .n { font-size: 44px; font-weight: 700; line-height: 1; transition: transform .2s; }
  .stat .n.bump { transform: scale(1.25); color: var(--brand); }
  .stat .l { color: var(--muted); font-size: 13px; margin-top: 6px; }
  .info { color: var(--muted); font-size: 14px; margin: 0 0 6px; }
  .ticket { background: linear-gradient(135deg, #4f46e5, #7c3aed); color: #fff; border-radius: 14px; padding: 18px; text-align: center; margin-top: 16px; animation: pop .3s ease; }
  .ticket .n { font-size: 56px; font-weight: 800; }
  .ticket .s { opacity: .9; }
  @keyframes pop { from { transform: scale(.85); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  .history { list-style: none; padding: 0; margin: 12px 0 0; display: flex; flex-wrap: wrap; gap: 6px; }
  .history li { background: #eef2ff; color: var(--brand); border-radius: 999px; padding: 4px 12px; font-weight: 600; font-size: 14px; }
  #toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: var(--ink); color: #fff; padding: 10px 18px; border-radius: 10px; opacity: 0; pointer-events: none; transition: opacity .2s; }
  #toast.show { opacity: 1; }
  #toast.err { background: var(--err); }
  #toast.ok { background: var(--ok); }
  .how { font-size: 13px; color: var(--muted); border-top: 1px dashed var(--line); margin-top: 16px; padding-top: 10px; }
</style>
</head>
<body>
<header>
  <h1>TurnHub</h1>
  <small>Sistema de turnos para empresas</small>
  <span class="dot" id="dot" title="Estado del servidor"></span>
</header>

<main>
  <section class="card">
    <h2>Empresas</h2>
    <div id="stores"><div class="empty">Cargando…</div></div>

    <details id="createBox">
      <summary>+ Registrar nueva empresa</summary>
      <form id="createForm">
        <label>Nombre *<input name="name" required minlength="2" maxlength="100" placeholder="Ej. Banco Central"></label>
        <label>Descripción<input name="description" maxlength="500"></label>
        <label>Dirección<input name="address" maxlength="200"></label>
        <label>Teléfono<input name="phone" placeholder="+52 555 123 4567"></label>
        <label>Correo<input name="email" type="email"></label>
        <button class="primary" type="submit">Registrar empresa</button>
      </form>
    </details>
  </section>

  <section class="card" id="detail">
    <div class="empty">👈 Selecciona o registra una empresa para ver su fila.</div>
  </section>
</main>

<div id="toast"></div>

<script>
  // Same origin when served by the API; fallback when opened as a file.
  const BASE = location.protocol.startsWith('http') ? '' : 'http://localhost:3000';
  const $ = s => document.querySelector(s);
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

  let stores = [];
  let selected = null;       // store object
  let myTickets = {};        // storeId -> [ticketNumber, ...] (taken from this page)
  let lastShown = {};        // storeId -> ticket just taken
  let prevStatus = null;
  let pollTimer = null;

  function toast(msg, kind) {
    const t = $('#toast');
    t.textContent = msg;
    t.className = 'show ' + (kind || '');
    clearTimeout(toast.t);
    toast.t = setTimeout(() => t.className = '', 3000);
  }

  async function api(method, path, body) {
    const res = await fetch(BASE + path, {
      method,
      headers: body ? { 'Content-Type': 'application/json' } : {},
      body: body ? JSON.stringify(body) : undefined,
    });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) {
      const det = Array.isArray(data.details) ? ' — ' + data.details.map(d => d.message || d).join(', ') : '';
      throw new Error((data.error || 'Error ' + res.status) + det);
    }
    return data;
  }

  async function checkHealth() {
    try { await api('GET', '/health'); $('#dot').classList.add('on'); }
    catch { $('#dot').classList.remove('on'); }
  }

  async function loadStores() {
    try {
      const d = await api('GET', '/api/stores');
      stores = Array.isArray(d) ? d : (d.stores || d.data || []);
      renderStores();
    } catch (e) {
      $('#stores').innerHTML = `<div class="empty">No se pudo conectar con el servidor.<br>${esc(e.message)}</div>`;
    }
  }

  function renderStores() {
    const box = $('#stores');
    if (!stores.length) { box.innerHTML = '<div class="empty">Aún no hay empresas.</div>'; return; }
    box.innerHTML = stores.map(s => `
      <button class="store ${selected && selected._id === s._id ? 'active' : ''}" data-id="${esc(s._id)}">
        <b>${esc(s.name)}</b>
        <span>${esc(s.address || s.description || 'Sin detalles')}</span>
      </button>`).join('');
    box.querySelectorAll('.store').forEach(b => b.onclick = () => select(b.dataset.id));
  }

  function select(id) {
    selected = stores.find(s => s._id === id);
    prevStatus = null;
    renderStores();
    renderDetail(null);
    refreshStatus();
    clearInterval(pollTimer);
    pollTimer = setInterval(refreshStatus, 3000);
  }

  async function refreshStatus() {
    if (!selected) return;
    try {
      const st = await api('GET', `/api/stores/${selected._id}/queue`);
      renderDetail(st);
    } catch (e) { toast(e.message, 'err'); }
  }

  function renderDetail(st) {
    if (!selected) return;
    const mine = myTickets[selected._id] || [];
    const t = lastShown[selected._id];
    const bump = n => prevStatus && prevStatus[n] !== st[n] ? 'bump' : '';

    $('#detail').innerHTML = `
      <h2>${esc(selected.name)}</h2>
      ${selected.description ? `<p class="info">${esc(selected.description)}</p>` : ''}
      ${selected.address ? `<p class="info">📍 ${esc(selected.address)}</p>` : ''}
      ${selected.phone ? `<p class="info">📞 ${esc(selected.phone)}</p>` : ''}

      <div class="stats">
        <div class="stat"><div class="n ${st ? bump('waitingCount') : ''}">${st ? st.waitingCount : '…'}</div><div class="l">Personas en espera</div></div>
        <div class="stat"><div class="n ${st ? bump('lastTicketNumber') : ''}">${st ? st.lastTicketNumber : '…'}</div><div class="l">Último turno entregado</div></div>
      </div>

      <button class="primary" id="joinBtn">🎟️ Tomar turno</button>

      ${t ? `<div class="ticket"><div class="s">Tu turno</div><div class="n">#${t.ticketNumber}</div><div class="s">Estado: ${esc(t.status)}</div></div>` : ''}

      ${mine.length ? `<div class="how">Turnos que has tomado en esta página:</div>
        <ul class="history">${mine.map(n => `<li>#${n}</li>`).join('')}</ul>` : ''}

      <div class="how">Cómo funciona: cada vez que alguien toma turno, se le asigna el siguiente número (último + 1) y entra a la fila en espera. Esta vista se actualiza sola cada 3 segundos, así que puedes abrirla en dos pestañas y ver cómo cambia.</div>
    `;
    if (st) prevStatus = st;
    $('#joinBtn').onclick = join;
  }

  async function join() {
    const btn = $('#joinBtn');
    btn.disabled = true;
    try {
      const ticket = await api('POST', `/api/stores/${selected._id}/queue`);
      (myTickets[selected._id] ||= []).push(ticket.ticketNumber);
      lastShown[selected._id] = ticket;
      toast(`Turno #${ticket.ticketNumber} asignado`, 'ok');
      await refreshStatus();
    } catch (e) {
      toast(e.message, 'err');
      btn.disabled = false;
    }
  }

  $('#createForm').addEventListener('submit', async e => {
    e.preventDefault();
    const body = {};
    new FormData(e.target).forEach((v, k) => { v = String(v).trim(); if (v) body[k] = v; });
    try {
      const store = await api('POST', '/api/stores', body);
      toast(`Empresa "${store.name}" registrada`, 'ok');
      e.target.reset();
      $('#createBox').open = false;
      await loadStores();
      select(store._id);
    } catch (err) { toast(err.message, 'err'); }
  });

  checkHealth();
  loadStores();
  setInterval(checkHealth, 10000);
</script>
</body>
</html>
